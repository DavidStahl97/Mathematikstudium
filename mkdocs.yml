site_name: Mathematikstudium
site_description: Zusammenfassungen und Einsendeaufgaben zum Mathematikstudium
site_url: https://davidstahl97.github.io/Mathematikstudium/

theme:
  name: material
  custom_dir: overrides
  language: de
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

# nav wird von generate_docs.py automatisch generiert

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DavidStahl97/Mathematikstudium
