site_name: Mathematikstudium
site_description: Zusammenfassungen und Einsendeaufgaben zum Mathematikstudium
site_url: https://davidstahl97.github.io/Mathematikstudium/

theme:
  name: material
  language: de
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Module:
    - 61111 Mathematische Grundlagen:
      - Lektion 1:
        - Einsendeaufgaben: 61111-mathematische-grundlagen/lektion-1/einsendeaufgaben.md

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DavidStahl97/Mathematikstudium
