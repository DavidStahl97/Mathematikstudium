name: Docs generieren und deployen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: LaTeX kompilieren und Docs generieren
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Zusatzpakete installieren (Poppler, pip, unzip, git)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            poppler-utils \
            python3-pip \
            unzip \
            git \
            curl
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: PDF- und Lernkarten-Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: |
            skripte/**/*.pdf
            skripte/**/*.tex.hash
            .lernkarten-cache
          key: pdf-cache-${{ runner.os }}-${{ hashFiles('skripte/**/*.tex', 'build.py', 'generate_docs.py') }}
          restore-keys: |
            pdf-cache-${{ runner.os }}-

      - name: Geänderte .tex-Dateien kompilieren
        run: python3 build.py --skip-docs

      - name: MkDocs installieren
        run: pip3 install --break-system-packages mkdocs-material pyyaml

      - name: Docs generieren (docs/ + mkdocs.yml nav)
        id: gendocs
        env:
          GENERATE_LERNKARTEN: "1"
        run: |
          set -o pipefail
          python3 generate_docs.py 2>&1 | tee gendocs.log

      - name: gendocs-Log hochladen (immer)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gendocs-log
          path: gendocs.log
          if-no-files-found: ignore

      - name: PDF.js herunterladen
        run: |
          PDFJS_TAG=$(curl -sf "https://api.github.com/repos/mozilla/pdf.js/releases/latest" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          PDFJS_VERSION=${PDFJS_TAG#v}
          echo "Lade PDF.js ${PDFJS_TAG} herunter ..."
          curl -sfL "https://github.com/mozilla/pdf.js/releases/download/${PDFJS_TAG}/pdfjs-${PDFJS_VERSION}-dist.zip" \
            -o pdfjs.zip
          unzip -q pdfjs.zip -d docs/assets/pdfjs
          rm pdfjs.zip

      - name: MkDocs bauen
        run: mkdocs build

      - name: HTML-Seite als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/

      - name: Git konfigurieren
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy zu gh-pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: mkdocs gh-deploy --force
