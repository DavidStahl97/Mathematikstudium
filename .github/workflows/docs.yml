name: GitHub Pages mit MkDocs deployen

on:
  push:
    branches: [main, master]
    paths:
      - 'skripte/**.tex'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: LaTeX zu HTML konvertieren und Seite deployen
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Pandoc installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: LaTeX-Dateien zu Markdown konvertieren
        run: |
          mkdir -p docs/skripte
          for texfile in skripte/*.tex; do
            [ -f "$texfile" ] || continue
            basename=$(basename "$texfile" .tex)
            echo "Konvertiere $texfile -> docs/skripte/$basename.md ..."
            pandoc "$texfile" \
              --from=latex \
              --to=markdown+tex_math_dollars \
              --wrap=none \
              --output="docs/skripte/$basename.md"
            echo "  -> OK"
          done

      - name: Python und MkDocs einrichten
        run: |
          pip install mkdocs-material

      - name: MkDocs bauen und auf gh-pages deployen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force
