name: GitHub Pages mit MkDocs deployen

on:
  push:
    branches: [main, master]
    paths:
      - 'skripte/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: PDFs kompilieren und Seite deployen
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: TeX Live installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-lang-german \
            texlive-fonts-recommended

      - name: Alle .tex-Dateien rekursiv zu PDFs kompilieren
        run: |
          find skripte -name "*.tex" | while read texfile; do
            relpath="${texfile#skripte/}"
            reldir=$(dirname "$relpath")
            basename=$(basename "$texfile" .tex)
            texdir=$(dirname "$texfile")

            echo "Kompiliere $texfile ..."
            (cd "$texdir" && \
              pdflatex -interaction=nonstopmode -file-line-error "$basename.tex" && \
              pdflatex -interaction=nonstopmode -file-line-error "$basename.tex")

            mkdir -p "docs/pdfs/$reldir"
            cp "$texdir/$basename.pdf" "docs/pdfs/$reldir/$basename.pdf"
            echo "  -> docs/pdfs/$reldir/$basename.pdf"
          done

      - name: Python und MkDocs einrichten
        run: |
          pip install mkdocs-material

      - name: MkDocs bauen und auf gh-pages deployen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force
