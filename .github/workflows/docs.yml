name: Docs generieren und deployen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: LaTeX kompilieren und Docs generieren
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: TeX Live und Poppler installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-lang-german \
            texlive-fonts-recommended \
            poppler-utils

      - name: Alle .tex-Dateien rekursiv kompilieren
        run: |
          find skripte -name "*.tex" | while read texfile; do
            basename=$(basename "$texfile" .tex)
            texdir=$(dirname "$texfile")
            echo "Kompiliere $texfile ..."
            (cd "$texdir" && \
              pdflatex -interaction=nonstopmode -file-line-error "$basename.tex" && \
              pdflatex -interaction=nonstopmode -file-line-error "$basename.tex")
          done

      - name: Python und MkDocs installieren
        run: pip install mkdocs-material pyyaml

      - name: Docs generieren (docs/ + mkdocs.yml nav)
        run: python generate_docs.py

      - name: PDF.js herunterladen
        run: |
          PDFJS_TAG=$(curl -sf "https://api.github.com/repos/mozilla/pdf.js/releases/latest" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          PDFJS_VERSION=${PDFJS_TAG#v}
          echo "Lade PDF.js ${PDFJS_TAG} herunter ..."
          curl -sfL "https://github.com/mozilla/pdf.js/releases/download/${PDFJS_TAG}/pdfjs-${PDFJS_VERSION}-dist.zip" \
            -o pdfjs.zip
          unzip -q pdfjs.zip -d docs/assets/pdfjs
          rm pdfjs.zip

      - name: MkDocs bauen
        run: mkdocs build

      - name: HTML-Seite als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/

      - name: Git konfigurieren
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy zu gh-pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: mkdocs gh-deploy --force
