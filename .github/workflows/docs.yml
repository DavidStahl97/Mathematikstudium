name: Docs generieren und deployen

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: LaTeX kompilieren und Docs generieren
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: TeX Live installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-lang-german \
            texlive-fonts-recommended

      - name: Alle .tex-Dateien rekursiv kompilieren
        run: |
          find skripte -name "*.tex" | while read texfile; do
            basename=$(basename "$texfile" .tex)
            texdir=$(dirname "$texfile")
            echo "Kompiliere $texfile ..."
            (cd "$texdir" && \
              pdflatex -interaction=nonstopmode -file-line-error "$basename.tex" && \
              pdflatex -interaction=nonstopmode -file-line-error "$basename.tex")
          done

      - name: Python und MkDocs installieren
        run: pip install mkdocs-material pyyaml

      - name: Docs generieren (docs/ + mkdocs.yml nav)
        run: python generate_docs.py

      - name: MkDocs bauen
        run: mkdocs build

      - name: HTML-Seite als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/

      - name: Git konfigurieren
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy zu gh-pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: mkdocs gh-deploy --force
