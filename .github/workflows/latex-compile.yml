name: Docs generieren und deployen

on:
  push:
    branches: [main, master]
    paths:
      - 'skripte/**'
      - 'generate_docs.py'
      - 'mkdocs.yml'
      - '.github/workflows/latex-compile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: LaTeX kompilieren, Docs generieren, GitHub Pages deployen
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: TeX Live installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-lang-german \
            texlive-fonts-recommended

      - name: Alle .tex-Dateien rekursiv kompilieren
        run: |
          find skripte -name "*.tex" | while read texfile; do
            basename=$(basename "$texfile" .tex)
            texdir=$(dirname "$texfile")
            echo "Kompiliere $texfile ..."
            (cd "$texdir" && \
              pdflatex -interaction=nonstopmode -file-line-error "$basename.tex" && \
              pdflatex -interaction=nonstopmode -file-line-error "$basename.tex")
          done

      - name: Python und MkDocs installieren
        run: pip install mkdocs-material pyyaml

      - name: Docs generieren (docs/ + mkdocs.yml nav)
        run: python generate_docs.py

      - name: Git-Nutzer konfigurieren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: GitHub Pages deployen
        run: mkdocs gh-deploy --force
