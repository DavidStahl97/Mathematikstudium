name: LaTeX kompilieren

on:
  push:
    branches: [main, master]
    paths:
      - 'skripte/**'
      - '.github/workflows/latex-compile.yml'
  pull_request:
    paths:
      - 'skripte/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-latex:
    name: LaTeX zu PDF kompilieren
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: TeX Live installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-lang-german \
            texlive-fonts-recommended

      - name: Alle .tex-Dateien rekursiv kompilieren
        run: |
          find skripte -name "*.tex" | while read texfile; do
            basename=$(basename "$texfile" .tex)
            texdir=$(dirname "$texfile")
            echo "Kompiliere $texfile ..."
            (cd "$texdir" && \
              pdflatex -interaction=nonstopmode -file-line-error "$basename.tex" && \
              pdflatex -interaction=nonstopmode -file-line-error "$basename.tex")
          done

      - name: PDFs als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: mathematik-pdfs
          path: skripte/**/*.pdf
          retention-days: 30
