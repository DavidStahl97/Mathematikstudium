name: LaTeX kompilieren

on:
  push:
    branches: [main, master]
    paths:
      - 'skripte/**.tex'
      - '.github/workflows/latex-compile.yml'
  pull_request:
    paths:
      - 'skripte/**.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-latex:
    name: LaTeX zu PDF kompilieren
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: TeX Live installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-lang-german \
            texlive-fonts-recommended

      - name: PDF kompilieren
        run: |
          cd skripte
          pdflatex -interaction=nonstopmode -file-line-error beispiel.tex
          pdflatex -interaction=nonstopmode -file-line-error beispiel.tex

      - name: PDF als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: mathematik-zusammenfassung-pdf
          path: skripte/beispiel.pdf
          retention-days: 30

      - name: PDF in releases hochladen (nur bei Push auf main/master)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pdf-latest
          name: "Aktuelle PDFs"
          files: skripte/beispiel.pdf
          make_latest: true
